x-clickhouse-credentials: &clickhouse-credentials
  CLICKHOUSE_DB: ${CLICKHOUSE_DB}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}

services:
  postgres:
    image: postgres:17-alpine
    container_name: music-platform-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=8
      - -c
      - max_wal_senders=8
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgweb:
    image: sosedoff/pgweb:0.16.2
    container_name: music-platform-pgweb
    restart: unless-stopped
    command: ["/usr/bin/pgweb", "--bind=0.0.0.0", "--listen=8081", "--readonly"]
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "127.0.0.1:${PGWEB_PORT}:8081"
    depends_on:
      postgres:
        condition: service_healthy

  storage:
    image: rustfs/rustfs:latest
    container_name: music-platform-storage
    restart: unless-stopped
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT}:9001"
    volumes:
      - storage_data:/data

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    container_name: music-platform-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:${KAFKA_EXTERNAL_PORT}
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT}:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.8.2
    container_name: music-platform-redpanda-console
    restart: unless-stopped
    environment:
      CONFIG_FILEPATH: /etc/console/console.yaml
    volumes:
      - ./infra/redpanda/console.yaml:/etc/console/console.yaml:ro
    ports:
      - "127.0.0.1:${REDPANDA_CONSOLE_PORT}:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  redpanda-topics:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    container_name: music-platform-redpanda-topics
    restart: "no"
    entrypoint: ["/bin/sh", "/init/create-topics.sh"]
    volumes:
      - ./infra/redpanda/create-topics.sh:/init/create-topics.sh:ro
    depends_on:
      redpanda:
        condition: service_healthy

  connect:
    image: quay.io/debezium/connect:3.0.7.Final
    container_name: music-platform-connect
    restart: unless-stopped
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: chime-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DEBEZIUM_PORT}:8083"
    depends_on:
      redpanda-topics:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  connect-init:
    image: curlimages/curl:8.11.1
    container_name: music-platform-connect-init
    restart: "no"
    entrypoint: ["/bin/sh", "/init/register.sh"]
    environment:
      CONNECT_URL: http://connect:8083
    volumes:
      - ./infra/debezium:/init:ro
    depends_on:
      connect:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: music-platform-clickhouse
    restart: unless-stopped
    environment:
      <<: *clickhouse-credentials
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT}:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" -q 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  clickhouse-migrate:
    image: clickhouse/clickhouse-server:25.3
    container_name: music-platform-clickhouse-migrate
    restart: "no"
    environment:
      <<: *clickhouse-credentials
    entrypoint: ["/bin/bash", "/migrations/apply.sh"]
    volumes:
      - ./infra/clickhouse:/migrations:ro
    depends_on:
      clickhouse:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:11.5.2
    container_name: music-platform-grafana
    restart: unless-stopped
    environment:
      <<: *clickhouse-credentials
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/chime-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  postgres_data:
  storage_data:
  redpanda_data:
  clickhouse_data:
  grafana_data:
