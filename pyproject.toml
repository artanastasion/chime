[project]
name = "music-platform"
version = "0.1.0"
description = "Music catalog and discovery platform for video creators"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.15.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "minio>=7.2.20",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "faker>=40.44.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
